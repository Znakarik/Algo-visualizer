<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- ARTIFACT-HEAD-START -->
<title>Конструктор алгоритмов</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@600&display=swap">
<link rel="stylesheet" href="styles.css">
<!-- ARTIFACT-HEAD-END -->
</head>
<body>
<!-- ARTIFACT-BODY-START -->
<header class="top">
  <h1>
    <svg class="logo" viewBox="0 0 28 28" aria-hidden="true">
      <rect x="2" y="2" width="10" height="7" rx="2" fill="var(--t-input)"/>
      <path d="M7 9v5M7 14l-4 5M7 14l4 5" stroke="var(--muted)" stroke-width="1.6" fill="none"/>
      <rect x="0" y="19" width="6" height="6" rx="1.5" fill="var(--yes)"/>
      <rect x="8" y="19" width="6" height="6" rx="1.5" fill="var(--no)"/>
      <rect x="17" y="10" width="10" height="7" rx="2" fill="var(--accent)"/>
    </svg>
    Конструктор алгоритмов
  </h1>
  <div class="toolbar">
    <select id="preset" class="btn" aria-label="Примеры"></select>
    <button id="btn-new" class="btn" type="button">Новый</button>
    <button id="btn-io" class="btn ghost" type="button" title="Показать алгоритм как JSON">JSON</button>
  </div>
</header>

<section class="savebar" aria-label="Сохранение">
  <label class="name-field">
    <span class="lbl">Алгоритм</span>
    <input id="algo-name" type="text" placeholder="Название, например «Подбор карт для оплаты»" autocomplete="off">
  </label>
  <button id="btn-save" class="btn primary" type="button" title="Сохранить в список «Мои алгоритмы» (Cmd+S)">Сохранить</button>
  <select id="library" class="btn" aria-label="Сохранённые алгоритмы"></select>
  <button id="btn-delete" class="btn ghost" type="button">Удалить</button>
  <span class="sep" aria-hidden="true"></span>
  <button id="btn-download" class="btn" type="button" title="Сохранить алгоритм во внешний файл .algo.json">Сохранить в файл</button>
  <button id="btn-open-file" class="btn" type="button" title="Открыть файл .algo.json">Открыть файл</button>
  <input id="file-input" type="file" accept=".json,application/json" hidden>
  <span id="file-link" class="file-link" hidden></span>
  <span id="save-state" class="save-state" role="status"></span>
</section>

<main class="layout">
  <section class="panel" aria-labelledby="h-flow">
    <div class="panel-head">
      <h2 id="h-flow">Схема</h2>
      <span class="block-msg" id="block-count"></span>
    </div>
    <div id="editor" class="flow"></div>
  </section>

  <section class="panel viewer" aria-labelledby="h-steps">
    <div class="panel-head"><h2 id="h-steps">Выполнение</h2></div>
    <div id="params-panel" class="params-panel" hidden></div>
    <div id="summary" class="summary"></div>
    <div class="player">
      <button id="btn-first" class="btn" type="button" title="В начало" aria-label="В начало">⏮</button>
      <button id="btn-prev" class="btn" type="button" title="Назад (←)" aria-label="Назад">←</button>
      <button id="btn-play" class="btn primary" type="button" title="Пуск / пауза (пробел)">▶ Пуск</button>
      <button id="btn-next" class="btn" type="button" title="Вперёд (→)" aria-label="Вперёд">→</button>
      <input id="scrub" type="range" min="0" max="0" value="0" aria-label="Шаг">
      <span id="counter" class="counter"></span>
    </div>
    <div id="step" class="step-card"></div>
    <div id="timeline" class="timeline" aria-label="Все шаги"></div>
  </section>
</main>

<div id="modal" class="modal-back" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-h">
    <h3 id="modal-h">Алгоритм в формате JSON</h3>
    <textarea id="io-text" spellcheck="false" aria-label="Алгоритм в формате JSON"></textarea>
    <div class="row">
      <span id="io-note" class="note"></span>
      <button id="io-copy" class="btn" type="button">Копировать</button>
      <button id="io-load" class="btn primary" type="button">Загрузить</button>
      <button id="io-close" class="btn ghost" type="button">Закрыть</button>
    </div>
  </div>
</div>

<script src="engine.js"></script>
<script src="examples.js"></script>
<script src="app.js"></script>
<!-- ARTIFACT-BODY-END -->
</body>
</html>
